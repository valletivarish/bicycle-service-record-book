# Local stack that mirrors production: PostgreSQL 16 (RDS on AWS), the API
# image and the web image. Build the frontend first (npm run build).
# Run from the repository root: docker compose -f infra/docker-compose.yml up --build
name: service-book

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: servicebook
      POSTGRES_PASSWORD: servicebook
      POSTGRES_DB: servicebook
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "servicebook"]
      interval: 2s
      retries: 20

  api:
    build:
      context: ../server
      dockerfile: ../../infra/docker/api.Dockerfile
    environment:
      PGHOST: db
      PGUSER: servicebook
      PGPASSWORD: servicebook
      PGDATABASE: servicebook
      RELEASE_ID: local-compose
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: infra/docker/web.Dockerfile
    ports:
      - "8090:8080"
    depends_on:
      - api

volumes:
  db-data:
