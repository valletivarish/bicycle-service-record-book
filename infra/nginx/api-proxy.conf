# Nginx on the EC2 host. CloudFront sends only /api/* here; the Angular files
# are served from S3. The Node container listens on 127.0.0.1:3000 only.
server {
    listen 80 default_server;
    server_name _;

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        return 404;
    }
}
