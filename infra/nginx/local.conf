# Local stand-in for CloudFront: serves the Angular build and sends /api/ to
# the API container, so the browser sees one origin exactly as on AWS.
server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Angular routes such as /records/12 are client-side; serve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
