# Nginx inside the web container (nginx-unprivileged, port 8080). It serves
# the Angular build and passes /api/ to the API container, so the browser
# only ever talks to one origin on port 80 of the Elastic IP.
server {
    listen 8080;
    root /usr/share/nginx/html;
    server_tokens off;

    # Docker's internal DNS, re-read every 10 s: when a release recreates the
    # API container it gets a new address, and this keeps the proxy following it.
    resolver 127.0.0.11 valid=10s;

    # add_header in a location replaces the server-level ones, so the security
    # headers are repeated in each location.
    location /api/ {
        set $api_upstream http://api:3000;
        proxy_pass $api_upstream;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header X-Content-Type-Options nosniff always;
    }

    # File names of the JS/CSS bundles carry a content hash, so they can be
    # cached for a year. index.html is always revalidated so a release shows up.
    location ~* \.(js|css|woff2?|ico)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    # Angular routes such as /records/12 have no file; serve index.html.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
        try_files $uri $uri/ /index.html;
    }
}
